<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voldaan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans pb-24">
    <!-- Header zonder problematische afbeelding -->
    <header class="bg-white border-b border-gray-100 py-3 px-4 sticky top-0 z-40 flex items-center justify-between shadow-xs max-w-md mx-auto w-full">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-sm shadow-xs">V</div>
            <div>
                <h1 class="text-sm font-bold text-indigo-950 leading-tight">Voldaan</h1>
                <p class="text-[10px] text-gray-400">Jouw zachte anker</p>
            </div>
        </div>
        <div id="header-status-badge" class="text-[11px] font-semibold text-indigo-700 bg-indigo-50 px-2.5 py-1 rounded-lg">
            Actief ✨
        </div>
    </header>

    <!-- Main App Content Container -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        <div id="vandaag" class="tab-content"></div>
        <div id="plannen" class="tab-content hidden"></div>
        <div id="vitality" class="tab-content hidden"></div>
        <div id="geld" class="tab-content hidden"></div>
        <div id="ideeen" class="tab-content hidden"></div>
        <div id="kennis" class="tab-content hidden"></div>
        <div id="inzichten" class="tab-content hidden"></div>
        <div id="luchtig" class="tab-content hidden"></div>
    </main>

    <!-- Jouw vertrouwde onderste menubalk -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-gray-100 py-2 px-2 z-40 max-w-md mx-auto shadow-lg">
        <div class="grid grid-cols-8 gap-0.5 text-center text-[10px] font-medium">
            <button data-tab="vandaag" class="nav-btn flex flex-col items-center justify-center py-1 text-indigo-600">
                <span class="text-base">✨</span><span>Vandaag</span>
            </button>
            <button data-tab="plannen" class="nav-btn flex flex-col items-center justify-center py-1 text-gray-400 hover:text-indigo-600">
                <span class="text-base">🎯</span><span>Plannen</span>
            </button>
            <button data-tab="vitality" class="nav-btn flex flex-col items-center justify-center py-1 text-gray-400 hover:text-indigo-600">
                <span class="text-base">⚡</span><span>Vitaliteit</span>
            </button>
            <button data-tab="geld" class="nav-btn flex flex-col items-center justify-center py-1 text-gray-400 hover:text-indigo-600">
                <span class="text-base">💶</span><span>Geld</span>
            </button>
            <button data-tab="ideeen" class="nav-btn flex flex-col items-center justify-center py-1 text-gray-400 hover:text-indigo-600">
                <span class="text-base">📌</span><span>Ideeën</span>
            </button>
            <button data-tab="kennis" class="nav-btn flex flex-col items-center justify-center py-1 text-gray-400 hover:text-indigo-600">
                <span class="text-base">📚</span><span>Kennis</span>
            </button>
            <button data-tab="inzichten" class="nav-btn flex flex-col items-center justify-center py-1 text-gray-400 hover:text-indigo-600">
                <span class="text-base">📊</span><span>Inzichten</span>
            </button>
            <button data-tab="luchtig" class="nav-btn flex flex-col items-center justify-center py-1 text-gray-400 hover:text-indigo-600">
                <span class="text-base">🍃</span><span>Luchtig</span>
            </button>
        </div>
    </nav>

    <script type="module" src="js/app.js"></script>
</body>
</html>
