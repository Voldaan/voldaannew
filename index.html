<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voldaan - Jouw Zachte Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Matter.js CDN voor de fysische zwaartekracht pot -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body class="bg-indigo-50/40 text-gray-800 font-sans min-h-screen flex flex-col antialiased">

    <!-- Hoofdnavigatie / Tabbladen -->
    <header class="bg-white border-b border-indigo-100 sticky top-0 z-40 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-2">
                <span class="text-xl">🪷</span>
                <h1 class="text-lg font-bold text-indigo-950 tracking-tight">Voldaan</h1>
            </div>
            <nav id="app-nav" class="flex flex-wrap justify-center gap-1.5 text-xs font-semibold">
                <button data-tab="vandaag" class="tab-btn px-3.5 py-2 rounded-xl transition bg-indigo-600 text-white shadow-sm">Vandaag</button>
                <button data-tab="plannen" class="tab-btn px-3.5 py-2 rounded-xl transition bg-white text-gray-600 hover:bg-indigo-50">Plannen</button>
                <button data-tab="money" class="tab-btn px-3.5 py-2 rounded-xl transition bg-white text-gray-600 hover:bg-indigo-50">Geld</button>
                <button data-tab="vitality" class="tab-btn px-3.5 py-2 rounded-xl transition bg-white text-gray-600 hover:bg-indigo-50">Vitaliteit</button>
                <button data-tab="ideeen" class="tab-btn px-3.5 py-2 rounded-xl transition bg-white text-gray-600 hover:bg-indigo-50">Ideeën</button>
                <button data-tab="inzichten" class="tab-btn px-3.5 py-2 rounded-xl transition bg-white text-gray-600 hover:bg-indigo-50">Inzichten</button>
            </nav>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-4xl mx-auto px-4 py-6 flex-1 w-full">
        <!-- Tabbladen Secties -->
        <div id="vandaag" class="tab-content"></div>
        <div id="plannen" class="tab-content hidden"></div>
        <div id="money" class="tab-content hidden"></div>
        <div id="vitality" class="tab-content hidden"></div>
        <div id="ideeen" class="tab-content hidden"></div>
        <div id="inzichten" class="tab-content hidden">
            <!-- Inzichten Container -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border-2 border-indigo-100">
                <h2 class="text-base font-bold text-indigo-950 mb-1">🔍 Inzichten & Verbanden</h2>
                <p class="text-xs text-gray-500 mb-4">Hier komen straks alle trends en koppelingen samen.</p>
                <div id="inzichten-content" class="space-y-3 text-xs text-gray-600">
                    <p class="italic">Alle Historie & Trends van de tabbladen worden hier binnenkort gekoppeld voor diepe inzichten!</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-indigo-100 py-4 text-center text-[11px] text-gray-400">
        <p>Voldaan app • Ontworpen voor rust, overzicht en zachtheid 🪷</p>
    </footer>

    <!-- App JavaScript Entry Point -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
