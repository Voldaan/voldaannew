<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voldaan - Jouw Zachte Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-indigo-50/40 text-gray-800 font-sans min-h-screen flex flex-col antialiased">

    <!-- Hoofdnavigatie / Tabbladen (Strak op één lijn) -->
    <header class="bg-white border-b border-indigo-100 sticky top-0 z-40 shadow-sm">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between gap-2">
            <div class="flex items-center gap-1.5 flex-shrink-0">
                <span class="text-xl">🪷</span>
                <h1 class="text-base font-bold text-indigo-950 tracking-tight">Voldaan</h1>
            </div>
            <nav id="app-nav" class="flex items-center gap-1 overflow-x-auto no-scrollbar py-1">
                <button data-tab="vandaag" class="tab-btn px-3 py-1.5 rounded-xl transition bg-indigo-600 text-white shadow-sm text-xs font-semibold whitespace-nowrap">Vandaag</button>
                <button data-tab="plannen" class="tab-btn px-3 py-1.5 rounded-xl transition bg-white text-gray-600 hover:bg-indigo-50 text-xs font-semibold whitespace-nowrap">Plannen</button>
                <button data-tab="money" class="tab-btn px-3 py-1.5 rounded-xl transition bg-white text-gray-600 hover:bg-indigo-50 text-xs font-semibold whitespace-nowrap">Geld</button>
                <button data-tab="vitality" class="tab-btn px-3 py-1.5 rounded-xl transition bg-white text-gray-600 hover:bg-indigo-50 text-xs font-semibold whitespace-nowrap">Vitaliteit</button>
                <button data-tab="ideeen" class="tab-btn px-3 py-1.5 rounded-xl transition bg-white text-gray-600 hover:bg-indigo-50 text-xs font-semibold whitespace-nowrap">Ideeën</button>
                <button data-tab="inzichten" class="tab-btn px-3 py-1.5 rounded-xl transition bg-white text-gray-600 hover:bg-indigo-50 text-xs font-semibold whitespace-nowrap">Inzichten</button>
            </nav>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-md mx-auto px-4 py-5 flex-1 w-full">
        <!-- Tabbladen Secties -->
        <div id="vandaag" class="tab-content"></div>
        <div id="plannen" class="tab-content hidden"></div>
        <div id="money" class="tab-content hidden"></div>
        <div id="vitality" class="tab-content hidden"></div>
        <div id="ideeen" class="tab-content hidden"></div>
        <div id="inzichten" class="tab-content hidden">
            <div class="bg-white p-5 rounded-2xl shadow-sm border-2 border-indigo-100">
                <h2 class="text-base font-bold text-indigo-950 mb-1">🔍 Inzichten & Verbanden</h2>
                <p class="text-xs text-gray-500 mb-4">Hier komen straks alle trends en koppelingen samen.</p>
                <div id="inzichten-content" class="space-y-3 text-xs text-gray-600">
                    <p class="italic">Alle Historie & Trends van de tabbladen worden hier binnenkort gekoppeld voor diepe inzichten!</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-indigo-100 py-4 text-center text-[11px] text-gray-400">
        <p>Voldaan app • Ontworpen voor rust, overzicht en zachtheid 🪷</p>
    </footer>

    <!-- App JavaScript Entry Point -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
