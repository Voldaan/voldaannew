<!DOCTYPE html>
<html lang="nl">
<head>
    <link rel="icon" type="image/jpeg" href="icon.jpg?v=3">
    <link rel="apple-touch-icon" href="icon.jpg?v=3">
    <link rel="manifest" href="manifest.json?v=3">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voldaan - Jouw Zachte Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Matter.js CDN voor de fysische zwaartekracht pot -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <!-- Eigen Stylesheet -->
    <link rel="stylesheet" href="css/style.css?v=7.1">
</head>
<body class="bg-[#f7f5f0] text-gray-800 font-sans min-h-screen flex flex-col justify-between pb-20">
    
    <!-- Muurvast bovenaan met fixed position -->
    <div class="fixed-top-container">
        <!-- Header: Met iets meer ademruimte voor de Live-knop -->
        <header class="bg-white border-b border-indigo-100 w-full shadow-sm">
            <div class="max-w-md mx-auto px-4 py-2.5 flex items-center justify-between">
                <div class="flex items-center gap-2.5 overflow-hidden">
                    <div class="flex items-center gap-2 flex-shrink-0">
    <img src="icon.jpg?v=3" alt="Voldaan Logo" class="w-7 h-7 rounded-lg object-cover shadow-2xs border border-indigo-100/80">
    <h1 class="text-base font-bold text-indigo-950 tracking-tight">Voldaan</h1>
</div>
                    <span class="text-gray-300 text-sm">|</span>
                    <p class="text-xs text-gray-500 font-medium truncate">meer structuur, minder chaos</p>
                </div>
                <!-- Live knop met extra marge aan de linkerkant en iets compacter kader -->
                <button id="open-ticker-settings" class="ml-3 px-2.5 py-1 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 rounded-lg text-xs font-bold transition flex items-center gap-1 shadow-2xs flex-shrink-0 border border-emerald-200">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Live
                </button>
            </div>
        </header>

        <!-- Globale Live Ticker Balk -->
        <div id="global-ticker-container" class="ticker-wrapper hidden">
            <div id="global-ticker-track" class="ticker-track" title="Klik om te pauzeren/hervatten">
                <!-- Wordt automatisch gevuld -->
            </div>
        </div>
    </div>

    <!-- Live Ticker Instellingen Modal -->
    <div id="ticker-settings-modal" class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-xl space-y-4 text-xs">
            <div class="flex justify-between items-center">
                <h3 class="text-sm font-bold text-indigo-950 flex items-center gap-1">🔴 Live Ticker Instellingen</h3>
                <button id="close-ticker-settings" class="text-gray-400 hover:text-gray-600 text-base font-bold">✕</button>
            </div>
            <p class="text-gray-500">Beheer de weergave en het tempo van de live balk.</p>
            
            <div class="space-y-3 bg-gray-50 p-3 rounded-xl border border-gray-100">
                <div>
                    <label class="block font-semibold text-gray-700 mb-1">Zichtbaarheid</label>
                    <label class="flex items-center gap-2 cursor-pointer font-medium text-emerald-900">
                        <input type="checkbox" id="ticker-enabled-checkbox" class="rounded text-indigo-600" checked>
                        <span>Toon live ticker balk in de app</span>
                    </label>
                </div>

                <div class="pt-1">
                    <label class="block font-semibold text-gray-700 mb-1">Looptempo (Snelheid)</label>
                    <select id="ticker-speed-select" class="w-full px-3 py-2 bg-white border rounded-xl text-xs">
                        <option value="50">Snel (50s)</option>
                        <option value="80">Rustig & Traag (80s)</option>
                        <option value="100">Extra Langzaam (100s)</option>
                    </select>
                </div>

                <div class="space-y-2 pt-1 border-t border-gray-200">
                    <label class="block font-semibold text-gray-700">Te tonen onderdelen:</label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="show-ticker-matches" class="rounded text-indigo-600" checked>
                        <span>⚽ Voetbalwedstrijden deze week</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="show-ticker-tasks" class="rounded text-indigo-600" checked>
                        <span>🎯 Focus taken uit het zachte planbord</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="show-ticker-money" class="rounded text-indigo-600" checked>
                        <span>💰 Openstaande verwachte uitgaven deze week</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="show-ticker-weather" class="rounded text-indigo-600" checked>
                        <span>🌤️ Weer in Tegelen</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="show-ticker-news" class="rounded text-indigo-600" checked>
                        <span>📰 Omroep Venlo Headliners</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="show-ticker-nu-nl" class="rounded text-indigo-600" checked>
                        <span>📰 NU.nl Laatste Nieuws</span>
                    </label>
                </div>
            </div>

            <button id="save-ticker-settings" class="w-full py-2 bg-indigo-600 text-white rounded-xl font-semibold hover:bg-indigo-700 transition">Instellingen Opslaan ✨</button>
        </div>
    </div>

    <!-- Main Content Container -->
    <main class="max-w-md mx-auto px-4 py-5 flex-1 w-full main-content-spacing">
        <!-- Alle 8 Tabbladen Secties (Containers) -->
        <div id="vandaag" class="tab-content"></div>
        <div id="plannen" class="tab-content hidden"></div>
        <div id="money" class="tab-content hidden"></div>
        <div id="vitality" class="tab-content hidden"></div>
        <div id="ideeen" class="tab-content hidden"></div>
        <div id="kennis" class="tab-content hidden"></div>
        <div id="luchtig" class="tab-content hidden"></div>
        <div id="inzichten" class="tab-content hidden">
            <div class="bg-white p-5 rounded-2xl shadow-sm border-2 border-indigo-100">
                <h2 class="text-base font-bold text-indigo-950 mb-1">🔍 Inzichten & Verbanden</h2>
                <p class="text-xs text-gray-500 mb-4">Hier komen straks alle trends en koppelingen samen.</p>
                <div id="inzichten-content" class="space-y-3 text-xs text-gray-600">
                    <p class="italic">Alle Historie & Trends van de tabbladen worden hier binnenkort gekoppeld voor diepe inzichten!</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Vaste Navigatiebalk ONDERAAN -->
    <nav id="app-nav" class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-indigo-100 z-50 shadow-lg py-2 px-3">
        <div class="max-w-md mx-auto flex items-center gap-2 overflow-x-auto no-scrollbar text-[11px] font-semibold text-gray-500 justify-start">
            <button data-tab="vandaag" class="tab-btn flex flex-col items-center gap-0.5 px-3 py-1 transition text-indigo-600 flex-shrink-0">
                <span class="text-lg">☀️</span>
                <span>Vandaag</span>
            </button>
            <button data-tab="plannen" class="tab-btn flex flex-col items-center gap-0.5 px-3 py-1 transition hover:text-indigo-600 flex-shrink-0">
                <span class="text-lg">📅</span>
                <span>Plannen</span>
            </button>
            <button data-tab="money" class="tab-btn flex flex-col items-center gap-0.5 px-3 py-1 transition hover:text-indigo-600 flex-shrink-0">
                <span class="text-lg">💰</span>
                <span>Geld</span>
            </button>
            <button data-tab="vitality" class="tab-btn flex flex-col items-center gap-0.5 px-3 py-1 transition hover:text-indigo-600 flex-shrink-0">
                <span class="text-lg">🌱</span>
                <span>Vitaliteit</span>
            </button>
            <button data-tab="ideeen" class="tab-btn flex flex-col items-center gap-0.5 px-3 py-1 transition hover:text-indigo-600 flex-shrink-0">
                <span class="text-lg">💡</span>
                <span>Ideeën</span>
            </button>
            <button data-tab="kennis" class="tab-btn flex flex-col items-center gap-0.5 px-3 py-1 transition hover:text-indigo-600 flex-shrink-0">
                <span class="text-lg">🧠</span>
                <span>Kennis</span>
            </button>
            <button data-tab="luchtig" class="tab-btn flex flex-col items-center gap-0.5 px-3 py-1 transition hover:text-indigo-600 flex-shrink-0">
                <span class="text-lg">🎈</span>
                <span>Luchtig</span>
            </button>
            <button data-tab="inzichten" class="tab-btn flex flex-col items-center gap-0.5 px-3 py-1 transition hover:text-indigo-600 flex-shrink-0">
                <span class="text-lg">🔍</span>
                <span>Inzichten</span>
            </button>
        </div>
    </nav>

    <!-- App JavaScript Entry Point -->
    <script type="module" src="js/app.js?v=7.1"></script>
</body>
</html>
