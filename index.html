<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voldaan — Jouw Zachte Kompas</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input, select, textarea, button { font-size: 16px !important; }
    </style>
</head>
<body class="bg-slate-50 text-gray-800 antialiased min-h-screen flex flex-col pb-24">

    <!-- Header -->
    <header class="bg-white border-b border-gray-100 sticky top-0 z-40 px-4 py-3 shadow-sm">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold text-indigo-950 flex items-center gap-2">
                <span>🪷</span> Voldaan
            </h1>
            <span class="text-xs text-indigo-600 font-medium bg-indigo-50 px-2.5 py-1 rounded-full">Zacht & Zonder Oordeel</span>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-3xl w-full mx-auto p-4 flex-1">
        <!-- 1. Vandaag -->
        <section id="vandaag" class="view-section"></section>
        <!-- 2. Planbord -->
        <section id="plannen" class="view-section hidden"></section>
        <!-- 3. Vitaliteit -->
        <section id="vitality" class="view-section hidden"></section>
        <!-- 4. Geld -->
        <section id="geld" class="view-section hidden"></section>
        <!-- 5. Ideeënkluis -->
        <section id="ideeen" class="view-section hidden"></section>
        <!-- 6. Kennis & Hacks -->
        <section id="kennis" class="view-section hidden"></section>
        <!-- 7. Inzichten -->
        <section id="inzichten" class="view-section hidden"></section>
        <!-- 8. Luchtig -->
        <section id="luchtig" class="view-section hidden"></section>
    </main>

    <!-- Meescrollende Onderste Navigatiebalk (Mobiel geoptimaliseerd) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-40 shadow-lg">
        <div class="max-w-3xl mx-auto flex overflow-x-auto no-scrollbar py-2 px-2 gap-1 justify-start sm:justify-center">
            <button data-target="vandaag" class="nav-tab-btn flex flex-col items-center px-3 py-1.5 rounded-xl text-[11px] font-medium transition whitespace-nowrap bg-indigo-600 text-white shadow-sm">
                <span>✨</span><span>Vandaag</span>
            </button>
            <button data-target="plannen" class="nav-tab-btn flex flex-col items-center px-3 py-1.5 rounded-xl text-[11px] font-medium transition whitespace-nowrap text-gray-600 hover:bg-gray-100">
                <span>🎯</span><span>Planbord</span>
            </button>
            <button data-target="vitality" class="nav-tab-btn flex flex-col items-center px-3 py-1.5 rounded-xl text-[11px] font-medium transition whitespace-nowrap text-gray-600 hover:bg-gray-100">
                <span>⚡</span><span>Vitaliteit</span>
            </button>
            <button data-target="geld" class="nav-tab-btn flex flex-col items-center px-3 py-1.5 rounded-xl text-[11px] font-medium transition whitespace-nowrap text-gray-600 hover:bg-gray-100">
                <span>💶</span><span>Geld</span>
            </button>
            <button data-target="ideeen" class="nav-tab-btn flex flex-col items-center px-3 py-1.5 rounded-xl text-[11px] font-medium transition whitespace-nowrap text-gray-600 hover:bg-gray-100">
                <span>💡</span><span>Ideeën</span>
            </button>
            <button data-target="kennis" class="nav-tab-btn flex flex-col items-center px-3 py-1.5 rounded-xl text-[11px] font-medium transition whitespace-nowrap text-gray-600 hover:bg-gray-100">
                <span>🧠</span><span>Kennis</span>
            </button>
            <button data-target="inzichten" class="nav-tab-btn flex flex-col items-center px-3 py-1.5 rounded-xl text-[11px] font-medium transition whitespace-nowrap text-gray-600 hover:bg-gray-100">
                <span>📊</span><span>Inzichten</span>
            </button>
            <button data-target="luchtig" class="nav-tab-btn flex flex-col items-center px-3 py-1.5 rounded-xl text-[11px] font-medium transition whitespace-nowrap text-gray-600 hover:bg-gray-100">
                <span>🎈</span><span>Luchtig</span>
            </button>
        </div>
    </nav>

    <!-- App Entry Script -->
    <script type="module" src="./js/app.js"></script>
</body>
</html>
