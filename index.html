<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voldaan - Jouw Zachte Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Matter.js CDN voor de fysische zwaartekracht pot -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body class="bg-indigo-50/40 text-gray-800 font-sans min-h-screen flex flex-col antialiased pb-20">

    <!-- Header / Logo bovenaan -->
    <header class="bg-white border-b border-indigo-100 sticky top-0 z-40 shadow-sm">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-center gap-2">
            <span class="text-xl">🪷</span>
            <h1 class="text-base font-bold text-indigo-950 tracking-tight">Voldaan</h1>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-md mx-auto px-4 py-5 flex-1 w-full">
        <!-- Tabbladen Secties -->
        <div id="vandaag" class="tab-content"></div>
        <div id="plannen" class="tab-content hidden"></div>
        <div id="money" class="tab-content hidden"></div>
        <div id="vitality" class="tab-content hidden"></div>
        <div id="ideeen" class="tab-content hidden"></div>
        <div id="inzichten" class="tab-content hidden">
            <div class="bg-white p-5 rounded-2xl shadow-sm border-2 border-indigo-100">
                <h2 class="text-base font-bold text-indigo-950 mb-1">🔍 Inzichten & Verbanden</h2>
                <p class="text-xs text-gray-500 mb-4">Hier komen straks alle trends en koppelingen samen.</p>
                <div id="inzichten-content" class="space-y-3 text-xs text-gray-600">
                    <p class="italic">Alle Historie & Trends van de tabbladen worden hier binnenkort gekoppeld voor diepe inzichten!</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Vaste Navigatiebalk ONDERAAN met Iconen -->
    <nav id="app-nav" class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-indigo-100 z-50 shadow-lg py-2 px-3">
        <div class="max-w-md mx-auto flex justify-around items-center text-[10px] font-semibold text-gray-500">
            <button data-tab="vandaag" class="tab-btn flex flex-col items-center gap-0.5 p-1 transition text-indigo-600">
                <span class="text-lg">☀️</span>
                <span>Vandaag</span>
            </button>
            <button data-tab="plannen" class="tab-btn flex flex-col items-center gap-0.5 p-1 transition hover:text-indigo-600">
                <span class="text-lg">📅</span>
                <span>Plannen</span>
            </button>
            <button data-tab="money" class="tab-btn flex flex-col items-center gap-0.5 p-1 transition hover:text-indigo-600">
                <span class="text-lg">💰</span>
                <span>Geld</span>
            </button>
            <button data-tab="vitality" class="tab-btn flex flex-col items-center gap-0.5 p-1 transition hover:text-indigo-600">
                <span class="text-lg">🌱</span>
                <span>Vitaliteit</span>
            </button>
            <button data-tab="ideeen" class="tab-btn flex flex-col items-center gap-0.5 p-1 transition hover:text-indigo-600">
                <span class="text-lg">💡</span>
                <span>Ideeën</span>
            </button>
            <button data-tab="inzichten" class="tab-btn flex flex-col items-center gap-0.5 p-1 transition hover:text-indigo-600">
                <span class="text-lg">🔍</span>
                <span>Inzichten</span>
            </button>
        </div>
    </nav>

    <!-- App JavaScript Entry Point -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
